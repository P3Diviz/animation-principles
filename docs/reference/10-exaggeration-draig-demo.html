<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference: Draig rig demo (Exaggeration take)</title>
<style>
/* Standalone rig demo. Shows how to drive Draig's named parts. Not a page layout: put the stage into the real 10-exaggeration page. */
:root{--text:#F5F5F7;--text-2:#A9A9C4;--accent:#9999FF;--ease:cubic-bezier(.33,0,.67,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 45% 40%,#2A2A6A 0%,#10103A 55%,#07071A 100%);color:var(--text);font:13px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;padding:12px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.28)}
.stage{position:relative;overflow:hidden}
.stage .floor{position:absolute;left:6%;right:6%;bottom:12%;height:1px;background:rgba(255,255,255,.14)}
.draig{position:absolute;left:18%;bottom:calc(12% - 1.6%);height:72%;width:auto;overflow:visible}
.balloon{position:absolute;right:12%;bottom:12%;height:58%;overflow:visible}
.panel{padding:18px}
.panel h2{color:var(--text-2);font-size:12px;font-weight:500;margin:14px 0 6px}
.seg{display:flex;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:transparent;color:var(--text-2);font:500 12px Inter,sans-serif;padding:7px 4px;border-radius:7px;cursor:pointer;transition:all .2s var(--ease)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--text)}
input[type=range]{width:100%;accent-color:#9999FF}
.note{color:var(--text-2);font-size:12px;margin-top:12px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
</style></head><body>

<aside class="glass panel">
  <h2 style="margin-top:0;display:flex;justify-content:space-between"><span>Realism to cartoon</span><span class="mono" id="pct">100%</span></h2>
  <input type="range" id="amount" min="0" max="150" value="100" aria-label="Exaggeration amount">
  <h2>Presets</h2>
  <div class="seg" id="presets"><button data-v="15">Realistic</button><button data-v="100" aria-pressed="true">Cartoon</button><button data-v="150">Too far</button></div>
  <p class="note" id="note"></p>
</aside>
<script type="module">
// ===== Draig rig helpers (copy into js/core/draig.js) =====
const part = id => document.getElementById(id);
const pivot = el => el.dataset.pivot.split(' ').map(Number);
// Scale a part about its own pivot (from data-pivot)
function scalePart(id, sx, sy = sx) { const el = part(id), [x, y] = pivot(el); el.setAttribute('transform', `translate(${x} ${y}) scale(${sx} ${sy}) translate(${-x} ${-y})`); }
function rotatePart(id, deg) { const el = part(id), [x, y] = pivot(el); el.setAttribute('transform', `rotate(${deg} ${x} ${y})`); }
function movePart(id, dx, dy) { part(id).setAttribute('transform', `translate(${dx} ${dy})`); }
function mouth(open) { part('mouth-smile').setAttribute('opacity', open ? 0 : 1); part('mouth-open').setAttribute('opacity', open ? 1 : 0); }

// ===== The take (js/pages/10-exaggeration.js) =====
let k = 1;
const amount = part('amount'), presets = [...document.querySelectorAll('#presets button')];
function setAmount(v) {
  k = v / 100; amount.value = v; part('pct').textContent = v + '%';
  presets.forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === +v));
  part('note').textContent = v < 35 ? 'Realistic: a small flinch. True to life, but easy to miss from the back of the room.'
    : v <= 110 ? 'Cartoon: squash, stretch and popping eyes sell the shock while it still feels like the same dragon.'
    : 'Too far: the eyes and stretch break the character. It stops being believable and becomes noise.';
}
amount.addEventListener('input', () => setAmount(+amount.value));
presets.forEach(b => b.addEventListener('click', () => setAmount(+b.dataset.v)));

const easeOut = t => 1 - Math.pow(1 - t, 3), clamp = t => Math.max(0, Math.min(1, t));
function envelope(t) {                       // 3-second loop: idle, pop at 0.8s, squash, stretch, hold, settle
  if (t < .8) return 0;
  if (t < .95) return -.12 * easeOut(clamp((t - .8) / .15));
  if (t < 1.08) return -.12 + .52 * easeOut(clamp((t - .95) / .13));
  if (t < 1.9) return .4;
  const u = clamp((t - 1.9) / .6); return .4 * Math.exp(-5 * u) * Math.cos(u * 9);
}
function frame(now) {
  const t = (now / 1000) % 3, e = envelope(t) * k, up = Math.max(0, e);
  const sy = 1 + e, sx = 1 / Math.sqrt(Math.max(.4, sy));            // keep volume
  const shake = k > 1.15 && t > 1.08 && t < 1.9 ? Math.sin(now / 18) * 3 * (k - 1.1) : 0;
  part('rig').setAttribute('transform', `translate(${shake} 0) translate(200 380) scale(${sx} ${sy}) translate(-200 -380)`);
  movePart('face', 0, -up * 30);
  scalePart('eye-left', 1 + up * .55, 1 + up * 1.1); scalePart('eye-right', 1 + up * .55, 1 + up * 1.1);
  scalePart('pupil-left', Math.max(.3, 1 - up * 1.4)); scalePart('pupil-right', Math.max(.3, 1 - up * 1.4));
  movePart('brows', 0, -up * 36);
  mouth(up > .1); scalePart('mouth', 1 + up * .7);
  rotatePart('arm-left', up * 120); rotatePart('arm-right', -up * 120);
  rotatePart('wing-left', -up * 30); rotatePart('wing-right', up * 30);
  rotatePart('tail', -up * 25); scalePart('crest', 1, 1 + up * .8);
  // blink once while idle
  const blink = t > .3 && t < .42 ? .1 : 1;
  if (up === 0) { scalePart('eye-left', 1, blink); scalePart('eye-right', 1, blink); }
  part('balloon').setAttribute('opacity', t >= .8 ? 0 : 1);
  part('burst').setAttribute('opacity', t >= .8 && t < 1.05 ? 1 - (t - .8) / .25 : 0);
  requestAnimationFrame(frame);
}
setAmount(100); requestAnimationFrame(frame);
</script></body></html>
